<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#0d2b30"/>
      <stop offset="100%" stop-color="#040c0e"/>
    </radialGradient>
    <radialGradient id="card" cx="40%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#080808"/>
    </radialGradient>
    <filter id="ambient">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="500" height="500" rx="250" fill="url(#bg)"/>

  <!-- Teal ambient glow behind card -->
  <ellipse cx="250" cy="250" rx="185" ry="180" fill="#0a4048" filter="url(#ambient)" opacity="0.45"/>

  <!-- Dashed decorative rings -->
  <circle cx="250" cy="250" r="213" fill="none" stroke="#1d6070" stroke-width="1.2" stroke-dasharray="5,11" opacity="0.5"/>
  <circle cx="250" cy="250" r="181" fill="none" stroke="#0f3a42" stroke-width="0.8" stroke-dasharray="3,16" opacity="0.3"/>

  <!-- Card, slightly tilted -->
  <g transform="rotate(-6, 250, 250)">
    <!-- Drop shadow -->
    <rect x="100" y="100" width="300" height="300" rx="150" fill="#000" opacity="0.7" transform="translate(5,8)"/>
    <!-- Card -->
    <rect x="100" y="100" width="300" height="300" rx="150" fill="url(#card)"/>
    <!-- Subtle border -->
    <rect x="100" y="100" width="300" height="300" rx="150" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

    <!-- AB text centered in card -->
    <text
      x="250"
      y="250"
      font-family="'Arial Black', 'Impact', 'Haettenschweiler', sans-serif"
      font-weight="900"
      font-size="160"
      letter-spacing="-8"
      fill="white"
      text-anchor="middle"
      dominant-baseline="middle"
      filter="url(#textGlow)"
    >AB</text>
  </g>
</svg>
